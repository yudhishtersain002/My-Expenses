<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- APP ICON -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

    <title>My Expenses</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f5f6f8;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 18px;
        }

        h1 {
            margin: 5px 0 20px;
            font-size: 30px;
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d7d9dd;
            border-radius: 11px;
            font-size: 16px;
            background: #fff;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        button {
            border: none;
            border-radius: 11px;
            padding: 13px 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .add-btn {
            width: 100%;
            margin-top: 16px;
            background: #111;
            color: white;
        }

        .excel-btn {
            width: 100%;
            background: #1f8f4c;
            color: white;
            margin-top: 10px;
        }

        .total-label {
            font-size: 14px;
            color: #777;
            margin-bottom: 5px;
        }

        .total {
            font-size: 34px;
            font-weight: 800;
        }

        .chart-wrapper {
            margin-top: 10px;
        }

        .chart {
            height: 245px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            border-bottom: 1px solid #ddd;
            padding: 10px 4px 0;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .chart::-webkit-scrollbar {
            display: none;
        }

        .month-column {
            flex: 0 0 calc(25% - 10px);
            min-width: calc(25% - 10px);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            scroll-snap-align: start;
            cursor: pointer;
        }

        .bar-area {
            height: 185px;
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .bar {
            width: 55%;
            min-height: 3px;
            background: #111;
            border-radius: 8px 8px 2px 2px;
            transition: height 0.3s ease;
        }

        .month-amount {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
            word-break: break-word;
        }

        .month-name {
            font-size: 12px;
            color: #555;
            margin-top: 8px;
            white-space: nowrap;
        }

        .hint {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 10px;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 25px 5px;
        }

        .expense-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 13px 0;
            border-bottom: 1px solid #eee;
        }

        .expense-row:last-child {
            border-bottom: none;
        }

        .expense-info {
            flex: 1;
            min-width: 0;
        }

        .expense-category {
            font-weight: 700;
            font-size: 15px;
        }

        .expense-note {
            color: #777;
            font-size: 13px;
            margin-top: 3px;
            word-break: break-word;
        }

        .expense-date {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        .expense-amount {
            font-weight: 800;
            white-space: nowrap;
        }

        .delete-btn {
            background: #f1f1f1;
            color: #d11;
            padding: 8px 10px;
            font-size: 13px;
        }

        .month-total {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            margin-top: 10px;
            border-top: 2px solid #eee;
            font-size: 18px;
            font-weight: 800;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            margin: 30px auto;
            border-radius: 18px;
            padding: 18px;
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-btn {
            background: #eee;
            padding: 8px 12px;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 13px;
            }

            h1 {
                font-size: 27px;
            }

            .month-column {
                flex: 0 0 calc(25% - 9px);
                min-width: calc(25% - 9px);
            }

            .bar {
                width: 65%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>My Expenses</h1>

    <!-- QUICK ADD -->
    <div class="card">
        <h2>Quick Add Expense</h2>

        <label for="amount">Amount (AED)</label>
        <input
            type="number"
            id="amount"
            placeholder="Enter amount"
            step="0.01"
            min="0"
        >

        <label for="category">Type</label>
        <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Rent">Rent</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
        </select>

        <label for="dateTime">Date & Time</label>
        <input type="datetime-local" id="dateTime">

        <label for="note">Note (Optional)</label>
        <textarea
            id="note"
            placeholder="Add a note..."
        ></textarea>

        <button class="add-btn" onclick="addExpense()">
            + Add Expense
        </button>
    </div>

    <!-- CURRENT MONTH TOTAL -->
    <div class="card">
        <div class="total-label">Current Month Total</div>
        <div class="total" id="currentMonthTotal">AED 0.00</div>
    </div>

    <!-- MONTHLY GRAPH -->
    <div class="card">
        <h2>Monthly Expenses</h2>

        <div class="chart-wrapper">
            <div class="chart" id="chart"></div>
        </div>

        <div class="hint">
            Swipe left or right • Tap a month for details
        </div>
    </div>

    <!-- EXCEL -->
    <div class="card">
        <button class="excel-btn" onclick="exportToExcel()">
            📊 Export to Excel
        </button>
    </div>

</div>

<!-- MONTH DETAILS MODAL -->
<div class="modal" id="monthModal">
    <div class="modal-content">

        <div class="modal-header">
            <h2 id="modalTitle">Month Details</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <div id="monthExpenses"></div>

    </div>
</div>

<script>

    const STORAGE_KEY = "my_expenses_data";

    let expenses = JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "[]"
    );


    /* -------------------------
       SAVE DATA
    ------------------------- */

    function saveExpenses() {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(expenses)
        );
    }


    /* -------------------------
       CURRENT DATE & TIME
    ------------------------- */

    function setCurrentDateTime() {

        const now = new Date();

        const localDate =
            new Date(
                now.getTime() -
                now.getTimezoneOffset() * 60000
            )
            .toISOString()
            .slice(0, 16);

        document.getElementById("dateTime").value = localDate;
    }


    /* -------------------------
       ADD EXPENSE
    ------------------------- */

    function addExpense() {

        const amountInput =
            document.getElementById("amount");

        const category =
            document.getElementById("category").value;

        const dateTime =
            document.getElementById("dateTime").value;

        const note =
            document.getElementById("note").value.trim();

        const amount =
            parseFloat(amountInput.value);


        if (!amount || amount <= 0) {
            alert("Please enter a valid amount.");
            return;
        }

        if (!dateTime) {
            alert("Please select date and time.");
            return;
        }


        const expense = {

            id: Date.now(),

            amount:
                Number(amount.toFixed(2)),

            category:

                category,

            dateTime:

                dateTime,

            note:

                note

        };


        expenses.push(expense);

        saveExpenses();


        amountInput.value = "";

        document.getElementById("note").value = "";

        setCurrentDateTime();

        renderAll();


        alert("Expense added successfully.");
    }


    /* -------------------------
       FORMAT MONEY
    ------------------------- */

    function formatMoney(amount) {

        return "AED " +
            Number(amount).toFixed(2);
    }


    /* -------------------------
       MONTH KEY
    ------------------------- */

    function getMonthKey(date) {

        const year =
            date.getFullYear();

        const month =
            String(
                date.getMonth() + 1
            ).padStart(2, "0");

        return `${year}-${month}`;
    }


    /* -------------------------
       MONTH NAME
    ------------------------- */

    function getMonthName(monthKey) {

        const parts =
            monthKey.split("-");

        const year =
            parseInt(parts[0]);

        const month =
            parseInt(parts[1]) - 1;

        const date =
            new Date(
                year,
                month,
                1
            );

        return date.toLocaleString(
            "en-US",
            {
                month: "short",
                year: "numeric"
            }
        );
    }


    /* -------------------------
       GET ALL MONTHS
    ------------------------- */

    function getAllMonths() {

        const months = [];

        const now = new Date();

        let startDate;


        if (expenses.length === 0) {

            startDate =
                new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    1
                );

        } else {

            const dates =
                expenses.map(
                    e => new Date(e.dateTime)
                );

            const earliest =
                new Date(
                    Math.min(
                        ...dates.map(
                            d => d.getTime()
                        )
                    )
                );

            startDate =
                new Date(
                    earliest.getFullYear(),
                    earliest.getMonth(),
                    1
                );
        }


        const endDate =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                1
            );


        while (startDate <= endDate) {

            months.push(
                getMonthKey(startDate)
            );

            startDate.setMonth(
                startDate.getMonth() + 1
            );
        }


        return months;
    }


    /* -------------------------
       MONTH TOTAL
    ------------------------- */

    function getMonthTotal(monthKey) {

        return expenses
            .filter(
                e =>
                    getMonthKey(
                        new Date(e.dateTime)
                    ) === monthKey
            )
            .reduce(
                (sum, e) =>
                    sum + Number(e.amount),
                0
            );
    }


    /* -------------------------
       CURRENT MONTH TOTAL
    ------------------------- */

    function renderCurrentMonthTotal() {

        const currentMonth =
            getMonthKey(new Date());

        const total =
            getMonthTotal(currentMonth);

        document.getElementById(
            "currentMonthTotal"
        ).textContent =
            formatMoney(total);
    }


    /* -------------------------
       RENDER CHART
    ------------------------- */

    function renderChart() {

        const chart =
            document.getElementById("chart");

        chart.innerHTML = "";


        const months =
            getAllMonths();


        const totals =
            months.map(
                month => getMonthTotal(month)
            );


        const maxTotal =
            Math.max(...totals, 1);


        months.forEach(
            (monthKey, index) => {

                const total =
                    totals[index];


                const column =
                    document.createElement("div");

                column.className =
                    "month-column";


                const amount =
                    document.createElement("div");

                amount.className =
                    "month-amount";

                amount.textContent =
                    total > 0
                        ? "AED " +
                          total.toFixed(0)
                        : "0";


                const barArea =
                    document.createElement("div");

                barArea.className =
                    "bar-area";


                const bar =
                    document.createElement("div");

                bar.className =
                    "bar";


                const height =
                    total > 0
                        ? Math.max(
                            5,
                            (total / maxTotal) * 170
                        )
                        : 3;


                bar.style.height =
                    height + "px";


                barArea.appendChild(bar);


                const monthName =
                    document.createElement("div");

                monthName.className =
                    "month-name";

                monthName.textContent =
                    getMonthName(monthKey);


                column.appendChild(amount);

                column.appendChild(barArea);

                column.appendChild(monthName);


                column.addEventListener(
                    "click",
                    () => openMonthDetails(monthKey)
                );


                chart.appendChild(column);

            }
        );
    }


    /* -------------------------
       OPEN MONTH DETAILS
    ------------------------- */

    function openMonthDetails(monthKey) {

        const modal =
            document.getElementById("monthModal");

        const title =
            document.getElementById("modalTitle");

        const container =
            document.getElementById("monthExpenses");


        title.textContent =
            getMonthName(monthKey);


        const monthExpenses =
            expenses
                .filter(
                    e =>
                        getMonthKey(
                            new Date(e.dateTime)
                        ) === monthKey
                )
                .sort(
                    (a, b) =>
                        new Date(b.dateTime) -
                        new Date(a.dateTime)
                );


        container.innerHTML = "";


        if (monthExpenses.length === 0) {

            container.innerHTML =
                '<div class="empty">No expenses for this month.</div>';

        } else {

            monthExpenses.forEach(
                expense => {

                    const row =
                        document.createElement("div");

                    row.className =
                        "expense-row";


                    const info =
                        document.createElement("div");

                    info.className =
                        "expense-info";


                    const category =
                        document.createElement("div");

                    category.className =
                        "expense-category";

                    category.textContent =
                        expense.category;


                    const note =
                        document.createElement("div");

                    note.className =
                        "expense-note";

                    note.textContent =
                        expense.note || "";


                    const date =
                        document.createElement("div");

                    date.className =
                        "expense-date";

                    const dateObj =
                        new Date(
                            expense.dateTime
                        );


                    date.textContent =
                        dateObj.toLocaleString(
                            "en-US",
                            {
                                day: "2-digit",
                                month: "short",
                                year: "numeric",
                                hour: "2-digit",
                                minute: "2-digit"
                            }
                        );


                    info.appendChild(category);

                    if (expense.note) {
                        info.appendChild(note);
                    }

                    info.appendChild(date);


                    const right =
                        document.createElement("div");


                    const amount =
                        document.createElement("div");

                    amount.className =
                        "expense-amount";

                    amount.textContent =
                        formatMoney(
                            expense.amount
                        );


                    const deleteButton =
                        document.createElement("button");

                    deleteButton.className =
                        "delete-btn";

                    deleteButton.textContent =
                        "Delete";


                    deleteButton.onclick =
                        function() {

                            deleteExpense(
                                expense.id
                            );

                        };


                    right.appendChild(amount);

                    right.appendChild(
                        deleteButton
                    );


                    row.appendChild(info);

                    row.appendChild(right);


                    container.appendChild(row);

                }
            );


            const total =
                monthExpenses.reduce(
                    (sum, e) =>
                        sum + Number(e.amount),
                    0
                );


            const totalRow =
                document.createElement("div");

            totalRow.className =
                "month-total";


            totalRow.innerHTML =
                `
                    <span>Month Total</span>
                    <span>${formatMoney(total)}</span>
                `;


            container.appendChild(
                totalRow
            );
        }


        modal.style.display =
            "block";
    }


    /* -------------------------
       DELETE EXPENSE
    ------------------------- */

    function deleteExpense(id) {

        const confirmed =
            confirm(
                "Delete this expense?"
            );


        if (!confirmed) {
            return;
        }


        expenses =
            expenses.filter(
                e => e.id !== id
            );


        saveExpenses();

        renderAll();


        const modal =
            document.getElementById(
                "monthModal"
            );

        modal.style.display =
            "none";
    }


    /* -------------------------
       CLOSE MODAL
    ------------------------- */

    function closeModal() {

        document.getElementById(
            "monthModal"
        ).style.display =
            "none";
    }


    /* -------------------------
       CLOSE MODAL OUTSIDE
    ------------------------- */

    window.addEventListener(
        "click",
        function(event) {

            const modal =
                document.getElementById(
                    "monthModal"
                );

            if (event.target === modal) {

                modal.style.display =
                    "none";
            }
        }
    );


    /* -------------------------
       EXCEL EXPORT
    ------------------------- */

    function exportToExcel() {

        if (expenses.length === 0) {

            alert(
                "There are no expenses to export."
            );

            return;
        }


        const workbook =
            XLSX.utils.book_new();


        const months =
            getAllMonths();


        months.forEach(
            monthKey => {

                const monthExpenses =
                    expenses
                        .filter(
                            e =>
                                getMonthKey(
                                    new Date(
                                        e.dateTime
                                    )
                                ) === monthKey
                        )
                        .sort(
                            (a, b) =>
                                new Date(
                                    a.dateTime
                                ) -
                                new Date(
                                    b.dateTime
                                )
                        );


                if (monthExpenses.length === 0) {
                    return;
                }


                const rows =
                    monthExpenses.map(
                        expense => {

                            const date =
                                new Date(
                                    expense.dateTime
                                );


                            return {

                                Date:
                                    date.toLocaleDateString(
                                        "en-GB"
                                    ),

                                Time:
                                    date.toLocaleTimeString(
                                        "en-US",
                                        {
                                            hour: "2-digit",
                                            minute: "2-digit"
                                        }
                                    ),

                                Type:
                                    expense.category,

                                Note:
                                    expense.note || "",

                                Amount:
                                    Number(
                                        expense.amount
                                    )

                            };

                        }
                    );


                const total =
                    monthExpenses.reduce(
                        (sum, e) =>
                            sum + Number(e.amount),
                        0
                    );


                rows.push({});

                rows.push({

                    Date: "",

                    Time: "",

                    Type: "",

                    Note: "MONTH TOTAL",

                    Amount: total

                });


                const worksheet =
                    XLSX.utils.json_to_sheet(
                        rows
                    );


                worksheet["!cols"] = [

                    { wch: 14 },

                    { wch: 12 },

                    { wch: 18 },

                    { wch: 35 },

                    { wch: 15 }

                ];


                let sheetName =
                    getMonthName(monthKey)
                        .replace(
                            /[\\\/\?\*\[\]:]/g,
                            ""
                        );


                sheetName =
                    sheetName.substring(
                        0,
                        31
                    );


                XLSX.utils.book_append_sheet(
                    workbook,
                    worksheet,
                    sheetName
                );

            }
        );


        XLSX.writeFile(
            workbook,
            "My Expenses.xlsx"
        );
    }


    /* -------------------------
       RENDER EVERYTHING
    ------------------------- */

    function renderAll() {

        renderCurrentMonthTotal();

        renderChart();
    }


    /* -------------------------
       INITIAL LOAD
    ------------------------- */

    setCurrentDateTime();

    renderAll();

</script>

</body>
</html>
